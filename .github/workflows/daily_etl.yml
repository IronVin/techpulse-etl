name: Daily TechPulse ETL

on:
  schedule:
    # Esegue ogni giorno alle 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch: # Permette di avviare la pipeline manualmente con un click su GitHub

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Esecuzione pipeline ETL
        run: python -m techpulse.main

      - name: Commit e push dei dati aggiornati
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/jobs.db data/latest_jobs.parquet
          git diff --staged --quiet || git commit -m "chore(data): aggiornamento giornaliero annunci tech"
          git push